name: Long native validation

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
      - run: cargo fetch --locked
      - run: cargo test --release -p puyudb-crdt --test mixed_histories thousands_of_seeded_partition_duplicate_restart_schedules --frozen -- --ignored
      - run: cargo test --release -p puyudb-crdt --example candidate_workloads --frozen -- --ignored
